	function change() {
		try {
			// check browser compatibility
			if (!window.getSelection) {
				returnTextSelection = 'ERRSEL003';
			}

			// get selection, initialize some local variables
			var sel = window.getSelection(), r, o, b, d, h, m, df = function(p) {
				while (p) {
					if (p.nodeType == 1
							&& p.className.indexOf('onlyVerticalScroll') >= 0)
						return true;
					p = p.parentNode;
				}
			}, s = /^\s$/, x = /[^A-Za-z0-9_\u00C0-\u02B8]/, t = [], f = function(
					a, b) {
				if (b > a)
					t.push(sel.substring(a, b));
			}, c = [], cd, a = function(v) {
				var i, t;
				v = v ? v.split(',') : [];
				for (i = 0; i < v.length; ++i)
					if ((t = v[i]) && c.indexOf(t) < 0)
						c.push(t);
			}, da = 'data-norm', ap = function(p) {
				if (p && p.tagName == 'SPAN')
					a(p.getAttribute(da));
			}, dl = '?!@';

			// validate selection
			if (sel.rangeCount != 1 || !(r = sel.getRangeAt(0)) || r.collapsed)
				return 'ERRSEL004';

			// snap selection to word boundaries
			if ((m = r.startContainer.nodeValue) && (b = r.startOffset) > 0) {
				while (b < r.startContainer.length && s.test(m.substr(b, 1)))
					++b;
				r.setStart(r.startContainer, (o = m.substr(0, b).split('')
						.reverse().join('').search(x)) < 0 ? 0 : (b - o));
			}
			if ((m = r.endContainer.nodeValue)
					&& (b = r.endOffset) < r.endContainer.length) {
				while (b > 0 && s.test(m.substr(b - 1, 1)))
					--b;
				r.setEnd(r.endContainer,
						(o = m.substr(b).search(x)) < 0 ? r.endContainer.length
								: (b + o));
			}

			// update selection range in UI
			sel.removeAllRanges();
			sel.addRange(r);

			// validate document
			if (!df(r.startContainer) || !df(r.endContainer))
				return 'ERRSEL006';

			// validate selection, again
			if (r.collapsed)
				return 'ERRSEL004';

			// fetch selection content
			d = document.createElement('div');
			d.appendChild(r.cloneContents());
			h = d.innerHTML;

			// look for unsupported HTML tags
			x = /<(\w+)[^>]*>/g;
			while (m = x.exec(h)) {
				if (m.length == 2
						&& m[1] != 'br'
						&& (m[1] != 'span' || m[0]
								.search(/id="n\d+"|class="edit"/) < 0))
					return 'ERRSEL002';
			}

			// extract tokens
			sel = sel.toString();
			x = /\s|[\x21-\x2F\x3A-\x40\x5B-\x60\x7B-\x7E]|\d\D|\D\d/g;
			o = 0;
			while (m = x.exec(sel)) {
				if (s.test(m[0])) {
					f(o, m.index);
				} else if (m[0].length == 2) {
					f(o, m.index + 1);
				} else {
					f(o, m.index);
					f(m.index, m.index + 1);
				}
				o = m.index + 1;
			}
			f(o, sel.length);
			if (t.length < 3)
				return 'ERRSEL001';
			t = t.join(' ');

			// extract norms
			for (o = 0; o < 2; ++o) {
				ap(r.startContainer.parentElement);
				x = new RegExp(da + '="([^"]+)', 'g');
				while (m = x.exec(h))
					a(m[1]);
				ap(r.endContainer.parentElement);
				da = 'data-orig';
				if (o == 0)
					cd = c, c = [];
			}

			// return the results
			returnTextSelection = cd.join(',') + dl + c.join(',') + dl + sel
					+ dl + t;
			return returnTextSelection;
			//return cd.join(',') + dl + c.join(',') + dl + sel + dl + t;

		} catch (ex) {
			// unexpected exception
			console.log('sel exception: ' + ex);
			return "ERRSEL005";
		}

			pointerTop = ypage;

		}

		var span = document.getElementById('n' + n), info = document

		var el = span, ox = 0, oy = 0;

		pointerTop = pointerTop - y99;
		pointerLeft = pointerLeft - x99;

		if (!frominfo) {

			while (el) {
				ox += el.offsetLeft;
				if (el.localName == "td") {
					if ((el.cellIndex > 0)) {
						var prev = el;
						while (prev.cellIndex > 0) {
							prev = prev.previousElementSibling;

							if (prev.localName == "td") {
								ox = ox - prev.offsetWidth;
							}
						}
						ox = ox - 8;

					} else {
						ox = ox - 8;
					}

					el = el.offsetParent;

				} else {
					el = el.offsetParent;
				}

			}

			el = span;
			while (el && el.id != 'VerticalScrollPanel1') {
				oy += el.offsetTop;
				el = el.offsetParent;
			}

			dup = span.cloneNode(false);
			dup.innerHTML = 'A';
			span.parentNode.appendChild(dup);
			dupheight = dup.offsetHeight;
			prevheight = span.offsetHeight;
			prevtop = span.offsetTop;
			info.style.top = (oy + dup.offsetHeight) + "px";
			span.parentNode.removeChild(dup);

			info.style.left = (pointerLeft - ox + span.offsetLeft) + "px";
		}

		if (info.style.visibility != "visible") {
			info.style.visibility = "visible";
			info.style.display = "block";

			//Rechts �ber den Bildschirm hinaus?
			breitejetzt = info.offsetLeft + info.offsetWidth + 20;
			if (breitejetzt > breiteursprung) {
				links = info.offsetLeft;
				groessendifferenz = links - (breitejetzt - breiteursprung) - 25;
				info.style.left = groessendifferenz + "px";
			}

			//Nach Unten �ber den Bildschirm hinaus?
			if (!frominfo) {
				if ((pointerTop - info.offsetTop - info.offsetHeight - y99 - 5) > (prevheight)) {
					info.style.top = oy + span.offsetHeight + "px";
				}

				hoehejetzt = pointerTop + info.offsetHeight;
				if (hoehejetzt > hoeheursprung) {
					oben = info.offsetTop;
					groessendifferenz = oben - (info.offsetHeight * 2 - 5);
					info.style.top = groessendifferenz + "px";
				}
			}
		}
	}
